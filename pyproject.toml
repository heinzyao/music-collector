[project]
name = "music-collector"
version = "0.1.0"
description = "Automatically collect best tracks from music review sites and create Spotify playlists"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "python-dotenv>=1.2.1",
    "spotipy>=2.25.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.50.0"]
test = ["pytest>=8.0", "respx>=0.22.0", "pytest-cov>=6.0"]
web = ["streamlit>=1.45.0"]
all = ["playwright>=1.50.0", "streamlit>=1.45.0"]

[project.scripts]
music-collector = "music_collector.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# 明確釘住規則集。CI 用 `uvx ruff` 會抓最新版，若繼承 ruff 當週的預設值，
# 上游擴充預設規則就會讓沒動過的舊程式碼一夜變紅（2026-08 即因此中斷 CI）。
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
